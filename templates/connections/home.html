{% extends "base.html" %}

{% block content %}

<!-- CREATE POST BOX -->
<div class="card shadow-sm mb-4 p-3">
    <input type="text" class="form-control mb-2" placeholder="What's on your mind?">
    <button class="btn btn-primary">Post</button>
</div>

<!-- POST 1 -->
<div class="card post-card shadow-sm mb-4">

    <div class="card-body d-flex justify-content-between align-items-center">
        <div class="d-flex gap-2 align-items-center">
            <div class="avatar">A</div>
            <div>
                <h6 class="mb-0">Alex Martin</h6>
                <small class="text-muted">2 hours ago</small>
            </div>
        </div>

        <i class="fas fa-ellipsis-h text-muted"></i>
    </div>

    <img src="https://picsum.photos/800/400" class="post-img w-100">

    <div class="card-body">
        <p>Beautiful day exploring new places 🌍✨</p>
    </div>

    <div class="card-footer bg-white d-flex justify-content-around">
        <button class="icon-btn"><i class="far fa-heart"></i> Like</button>
        <button class="icon-btn"><i class="far fa-comment"></i> Comment</button>
        <button class="icon-btn"><i class="far fa-share-square"></i> Share</button>
    </div>

</div>

<!-- POST 2 -->
<div class="card post-card shadow-sm mb-4">

    <div class="card-body d-flex justify-content-between align-items-center">
        <div class="d-flex gap-2 align-items-center">
            <div class="avatar">M</div>
            <div>
                <h6 class="mb-0">Maya</h6>
                <small class="text-muted">5 hours ago</small>
            </div>
        </div>

        <i class="fas fa-ellipsis-h text-muted"></i>
    </div>

    <div class="card-body">
        <p>Working on my new project 🚀</p>
    </div>

    <div class="card-footer bg-white d-flex justify-content-around">
        <button class="icon-btn"><i class="far fa-heart"></i> Like</button>
        <button class="icon-btn"><i class="far fa-comment"></i> Comment</button>
        <button class="icon-btn"><i class="far fa-share-square"></i> Share</button>
    </div>

</div>

{% endblock %}
