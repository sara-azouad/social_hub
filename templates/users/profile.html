{% extends 'base.html' %}
{% block content %}

<h2>👤 Profile</h2>

<div class="card">
  <h3>{{ user.username }}</h3>
  <p>Bio: {{ profile.bio }}</p>
</div>

<h3>Your Posts</h3>

{% for post in posts %}
<div class="card">
  <p>{{ post.content }}</p>
</div>
{% endfor %}

<a href="/posts/create/">Create Post</a>
<a href="/users/logout/">Logout</a>

{% endblock %}
