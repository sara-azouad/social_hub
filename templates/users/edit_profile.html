{% extends "base.html" %}
{% block title %}Edit Profile — SocialHub{% endblock %}
{% block content %}

<div class="card p-4">
  <h5 style="margin-bottom:24px;"><i class="fas fa-user-pen me-2" style="color:#00e5ff;"></i>Edit Profile</h5>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label style="color:#9ca3af;font-size:0.85rem;margin-bottom:6px;display:block;">Bio</label>
      <textarea name="bio" class="form-control" placeholder="Tell the world about yourself..." rows="3">{{ profile.bio }}</textarea>
    </div>
    <div class="mb-4">
      <label style="color:#9ca3af;font-size:0.85rem;margin-bottom:6px;display:block;">Profile Picture</label>
      <input type="file" name="profile_picture" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary" style="padding:10px 32px;">Save Changes</button>
  </form>
</div>

{% endblock %}
