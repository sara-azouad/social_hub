{% load static %}
<!doctype html>
<html>
  <head>
    <title>MySocial</title>

    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body class="bg-light">
    <div class="container-fluid vh-100">
      <div class="row h-100">
       
        <div
          class="col-md-6 d-flex flex-column justify-content-center align-items-center text-white"
          style="background: linear-gradient(135deg, #4a90e2, #145dbf)"
        >
          <h1 class="display-3 fw-bold">MySocial</h1>
          <p class="fs-5">Share moments with friends</p>
        </div>

        
        <div class="col-md-6 d-flex justify-content-center align-items-center">
          
          <div id="login-box" class="card shadow p-4" style="width: 350px">
            <h3 class="text-center mb-3">Login</h3>

            <form method="POST" action="{% url 'login' %}">
              {% csrf_token %}

              <input
                type="text"
                name="username"
                class="form-control mb-2"
                placeholder="Username"
              />
              <input
                type="password"
                name="password"
                class="form-control mb-3"
                placeholder="Password"
              />

              <button class="btn btn-primary w-100">Login</button>
            </form>

            <p class="text-center mt-3">
              Don't have an account?
              <a href="#" onclick="showRegister()">Register</a>
            </p>
          </div>

          
          <div
            id="register-box"
            class="card shadow p-4"
            style="width: 350px; display: none"
          >
            <h3 class="text-center mb-3">Register</h3>

            <form method="POST" action="{% url 'register' %}">
              {% csrf_token %}

              <input
                type="text"
                name="username"
                class="form-control mb-2"
                placeholder="Username"
              />
              <input
                type="password"
                name="password"
                class="form-control mb-3"
                placeholder="Password"
              />

              <button class="btn btn-success w-100">Sign up</button>
            </form>

            <p class="text-center mt-3">
              Already have an account?
              <a href="#" onclick="showLogin()">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      function showRegister() {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("register-box").style.display = "block";
      }

      function showLogin() {
        document.getElementById("register-box").style.display = "none";
        document.getElementById("login-box").style.display = "block";
      }
    </script>
  </body>
</html>
