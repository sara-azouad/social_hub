{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm p-4">

        <h3 class="mb-3">Edit Post</h3>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <textarea name="content" class="form-control mb-3" rows="4" required>{{ post.content }}</textarea>

            {% if post.image %}
            <img src="{{ post.image.url }}" class="img-fluid mb-3" style="max-height:300px;">
            {% endif %}

            <input type="file" name="image" class="form-control mb-3">

            <button class="btn btn-primary">
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
