{% extends "base.html" %}
{% block title %}Edit Post — SocialHub{% endblock %}
{% block content %}

<div class="card p-4">
  <h5 style="margin-bottom:24px;"><i class="fas fa-pen me-2" style="color:#00e5ff;"></i>Edit Post</h5>
  <form method="POST">
    {% csrf_token %}
    <div class="mb-4">
      <textarea name="content" class="form-control" rows="5" required>{{ post.content }}</textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" style="padding:10px 32px;">Save Changes</button>
      <a href="{% url 'home' %}" class="btn btn-secondary" style="padding:10px 24px;">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
