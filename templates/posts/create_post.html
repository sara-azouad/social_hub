{% extends "base.html" %}
{% block title %}New Post — SocialHub{% endblock %}
{% block content %}

<div class="card p-4">
  <h5 style="margin-bottom:24px;"><i class="fas fa-plus-circle me-2" style="color:#00e5ff;"></i>Create Post</h5>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <textarea name="content" class="form-control" placeholder="What's on your mind?" rows="4" required></textarea>
    </div>
    <div class="mb-4">
      <input type="file" name="image" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary" style="padding:10px 32px;">Publish Post</button>
  </form>
</div>

{% endblock %}
