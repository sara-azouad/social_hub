{% extends 'base.html' %} {% block content %}
<div class="card p-4">
  <h3>Create Post</h3>
  <form method="POST">
    {% csrf_token %}

    <input name="title" class="form-control mb-2" placeholder="Title" />

    <textarea
      name="content"
      class="form-control mb-2"
      placeholder="Content"
    ></textarea>

    <button class="btn btn-primary">Post</button>
  </form>
</div>

{% endblock %}
